<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>医生站 - 门诊分诊排队系统</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="header">
    <h1>门诊分诊排队系统 - 医生站</h1>
    <div class="user-info">
      <span id="userInfo"></span>
      <a href="#" onclick="logout()">退出登录</a>
    </div>
  </div>
  <div class="container">
    <div class="card">
      <h2>当前接诊</h2>
      <div id="currentPatient" style="text-align: center;">
        <p style="color: #999;">暂无正在接诊的患者</p>
      </div>
    </div>

    <div class="card">
      <h2>已叫号待接诊</h2>
      <div id="waitingPatient" style="text-align: center;">
        <p style="color: #999;">暂无待接诊患者</p>
      </div>
    </div>

    <div class="card">
      <h2>今日排队列表</h2>
      <table id="queueTable">
        <thead>
          <tr><th>序号</th><th>姓名</th><th>性别</th><th>年龄</th><th>身份证号</th><th>类型</th><th>状态</th><th>操作</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
      <h2>今日接诊记录</h2>
      <div id="historyTableContainer"></div>
    </div>

    <div class="card">
      <h2>随访计划管理</h2>
      <div class="form-row">
        <div class="form-group">
          <label>状态筛选</label>
          <select id="followupStatusFilter" onchange="loadFollowups()">
            <option value="">全部</option>
            <option value="pending">待提醒</option>
            <option value="contacted">已联系</option>
            <option value="no_answer">未接通</option>
            <option value="cancelled">已取消</option>
            <option value="completed">已完成</option>
          </select>
        </div>
        <div class="form-group">
          <label>日期范围</label>
          <input type="date" id="followupStartDate" onchange="loadFollowups()">
        </div>
        <div class="form-group">
          <label>至</label>
          <input type="date" id="followupEndDate" onchange="loadFollowups()">
        </div>
      </div>
      <table id="followupTable">
        <thead>
          <tr>
            <th>患者姓名</th><th>科室</th><th>复诊日期</th><th>提醒方式</th>
            <th>关联诊断</th><th>状态</th><th>创建时间</th><th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div id="consultModal" class="modal">
    <div class="modal-content">
      <h3>接诊记录</h3>
      <div id="consultPatientInfo"></div>
      <div class="form-group">
        <label>主诉</label>
        <textarea id="symptoms" rows="2" style="width: 100%;" placeholder="患者主诉症状"></textarea>
      </div>
      <div class="form-group">
        <label>诊断 *</label>
        <textarea id="diagnosis" rows="3" style="width: 100%;" placeholder="诊断结果（必填）"></textarea>
      </div>
      <div class="form-group">
        <label>处方</label>
        <textarea id="prescription" rows="3" style="width: 100%;" placeholder="开具的处方"></textarea>
      </div>
      <div class="form-group">
        <label>备注</label>
        <textarea id="notes" rows="2" style="width: 100%;" placeholder="其他备注"></textarea>
      </div>
      <hr style="margin: 20px 0; border: 1px solid #f0f0f0;">
      <h4 style="color: #096dd9; margin-bottom: 15px;">创建随访计划（可选）</h4>
      <div class="form-row">
        <div class="form-group">
          <label>复诊日期</label>
          <input type="date" id="followupDate">
        </div>
        <div class="form-group">
          <label>提醒方式</label>
          <select id="followupReminder">
            <option value="">不提醒</option>
            <option value="电话">电话</option>
            <option value="短信">短信</option>
            <option value="微信">微信</option>
            <option value="无">无</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>注意事项</label>
        <textarea id="followupNotes" rows="2" style="width: 100%;" placeholder="请填写复诊注意事项"></textarea>
      </div>
      <div style="text-align: right; margin-top: 20px;">
        <button class="btn btn-default" onclick="closeConsultModal()">取消</button>
        <button class="btn btn-success" onclick="completeConsult()">完成接诊</button>
      </div>
    </div>
  </div>

  <div id="followupCancelModal" class="modal">
    <div class="modal-content">
      <h3>取消随访计划</h3>
      <div class="form-group">
        <label>取消原因 *</label>
        <textarea id="followupCancelReason" rows="3" style="width: 100%;" placeholder="请输入取消原因"></textarea>
      </div>
      <div style="text-align: right; margin-top: 20px;">
        <button class="btn btn-default" onclick="closeFollowupCancelModal()">取消</button>
        <button class="btn btn-danger" onclick="confirmCancelFollowup()">确认取消</button>
      </div>
    </div>
  </div>

  <div id="alert"></div>
  <script src="/js/api.js"></script>
  <script>
    let currentUser = getUser();
    let currentConsultQueueId = null;
    let currentConsultPatientId = null;
    let currentConsultDeptId = null;
    let currentCancelFollowupId = null;
    if (!currentUser || currentUser.role !== 'doctor') window.location.href = 'login.html';
    document.getElementById('userInfo').textContent = `${currentUser.name} (医生)`;

    function escapeJs(str) {
      return (str || '').toString().replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    function showAlert(message, type = 'success') {
      document.getElementById('alert').innerHTML = `<div class="alert alert-${type}">${message}</div>`;
      setTimeout(() => document.getElementById('alert').innerHTML = '', 3000);
    }

    async function logout() {
      await api.logout();
      clearToken();
      window.location.href = 'login.html';
    }

    async function loadCurrent() {
      const consulting = await api.doctor.getConsulting();
      const typeMap = { appointment: '预约', walkin: '现场' };

      if (consulting) {
        document.getElementById('currentPatient').innerHTML = `
          <div class="queue-number-big">${consulting.queue_number}</div>
          <div class="patient-name-big">${consulting.patient_name}</div>
          <p>性别：${consulting.gender || '-'} | 年龄：${consulting.age || '-'}岁 | ${typeMap[consulting.type]}</p>
          <p style="color: #999;">接诊开始时间：${consulting.consultation_started_at}</p>
          <button class="btn btn-success" onclick="openConsultModal(${consulting.id}, '${escapeJs(consulting.patient_name)}', ${consulting.queue_number}, ${consulting.patient_id}, ${consulting.department_id})" style="margin-top: 15px;">
            填写记录并完成接诊
          </button>
        `;
      } else {
        document.getElementById('currentPatient').innerHTML = '<p style="color: #999;">暂无正在接诊的患者</p>';
      }
    }

    async function loadWaiting() {
      const waiting = await api.doctor.getCurrent();
      const typeMap = { appointment: '预约', walkin: '现场' };

      if (waiting) {
        document.getElementById('waitingPatient').innerHTML = `
          <div class="queue-number-big" style="color: #faad14;">${waiting.queue_number}</div>
          <div class="patient-name-big">${waiting.patient_name}</div>
          <p>性别：${waiting.gender || '-'} | 年龄：${waiting.age || '-'}岁 | ${typeMap[waiting.type]}</p>
          <p style="color: #999;">叫号时间：${waiting.called_at}</p>
          <button class="btn btn-primary" onclick="startConsult(${waiting.id})" style="margin-top: 15px;">
            开始接诊
          </button>
        `;
      } else {
        document.getElementById('waitingPatient').innerHTML = '<p style="color: #999;">暂无待接诊患者</p>';
      }
    }

    async function loadQueue() {
      const queue = await api.doctor.getQueue();
      const statusMap = { waiting: '等待中', called: '已叫号', consulting: '就诊中' };
      const typeMap = { appointment: '预约', walkin: '现场' };

      document.querySelector('#queueTable tbody').innerHTML = queue.map(q => `
        <tr>
          <td>${q.queue_number}</td>
          <td>${q.patient_name}</td>
          <td>${q.gender || '-'}</td>
          <td>${q.age || '-'}</td>
          <td>${q.id_card}</td>
          <td><span class="type-badge type-${q.type}">${typeMap[q.type]}</span></td>
          <td><span class="status-badge status-${q.status}">${statusMap[q.status]}</span></td>
          <td>
            ${q.status === 'called' ? `<button class="btn btn-sm btn-primary" onclick="startConsult(${q.id})">接诊</button>` : ''}
            ${q.status === 'consulting' && q.consulting_doctor_id === currentUser.id ? 
              `<button class="btn btn-sm btn-success" onclick="openConsultModal(${q.id}, '${escapeJs(q.patient_name)}', ${q.queue_number}, ${q.patient_id}, ${q.department_id})">完成</button>` : ''}
          </td>
        </tr>
      `).join('');
    }

    async function loadHistory() {
      const history = await api.doctor.getHistory();
      if (history.length === 0) {
        document.getElementById('historyTableContainer').innerHTML = '<p style="color: #999; text-align: center;">暂无接诊记录</p>';
        return;
      }

      document.getElementById('historyTableContainer').innerHTML = `
        <table>
          <thead>
            <tr><th>序号</th><th>患者姓名</th><th>身份证号</th><th>主诉</th><th>诊断</th><th>开始时间</th><th>结束时间</th></tr>
          </thead>
          <tbody>
            ${history.map(h => `
              <tr>
                <td>${h.queue_number}</td>
                <td>${h.patient_name}</td>
                <td>${h.id_card}</td>
                <td>${h.symptoms || '-'}</td>
                <td>${h.diagnosis}</td>
                <td>${h.consultation_started_at ? h.consultation_started_at.slice(11, 19) : '-'}</td>
                <td>${h.consultation_ended_at ? h.consultation_ended_at.slice(11, 19) : '-'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    async function startConsult(queueId) {
      if (!confirm('确认开始接诊该患者？')) return;
      try {
        await api.doctor.startConsult(queueId);
        showAlert('开始接诊');
        loadAll();
      } catch (e) {
        showAlert(e.message, 'error');
      }
    }

    async function openConsultModal(queueId, patientName, queueNumber, patientId, deptId) {
      currentConsultQueueId = queueId;
      currentConsultPatientId = patientId;
      currentConsultDeptId = deptId;
      document.getElementById('consultPatientInfo').innerHTML = `
        <p style="margin-bottom: 15px; padding: 10px; background: #f5f5f5; border-radius: 4px;">
          <strong>${queueNumber}号 - ${patientName}</strong>
        </p>
      `;
      document.getElementById('symptoms').value = '';
      document.getElementById('diagnosis').value = '';
      document.getElementById('prescription').value = '';
      document.getElementById('notes').value = '';
      document.getElementById('followupDate').value = '';
      document.getElementById('followupReminder').value = '';
      document.getElementById('followupNotes').value = '';
      document.getElementById('consultModal').classList.add('active');
    }

    function closeConsultModal() {
      currentConsultQueueId = null;
      document.getElementById('consultModal').classList.remove('active');
    }

    async function completeConsult() {
      const symptoms = document.getElementById('symptoms').value.trim();
      const diagnosis = document.getElementById('diagnosis').value.trim();
      const prescription = document.getElementById('prescription').value.trim();
      const notes = document.getElementById('notes').value.trim();
      
      const followupDate = document.getElementById('followupDate').value;
      const followupReminder = document.getElementById('followupReminder').value;
      const followupNotes = document.getElementById('followupNotes').value.trim();

      if (!diagnosis) return showAlert('请填写诊断结果', 'error');
      
      if (followupDate && !followupReminder) {
        return showAlert('请选择提醒方式', 'error');
      }
      if (followupReminder && !followupDate) {
        return showAlert('请选择复诊日期', 'error');
      }
      
      if (!confirm('确认完成接诊？')) return;

      try {
        const result = await api.doctor.completeConsult(currentConsultQueueId, { symptoms, diagnosis, prescription, notes });
        
        if (followupDate && followupReminder) {
          try {
            await api.doctor.createFollowup({
              patient_id: currentConsultPatientId,
              doctor_id: currentUser.id,
              department_id: currentConsultDeptId,
              queue_record_id: currentConsultQueueId,
              consultation_record_id: result.consultation_id,
              followup_date: followupDate,
              reminder_method: followupReminder,
              notes: followupNotes,
              related_diagnosis: diagnosis
            });
            showAlert('接诊完成，随访计划已创建');
          } catch (e) {
            showAlert(`接诊完成，但随访计划创建失败：${e.message}`, 'error');
          }
        } else {
          showAlert('接诊完成');
        }
        
        closeConsultModal();
        loadAll();
      } catch (e) {
        showAlert(e.message, 'error');
      }
    }

    async function loadAll() {
      await loadCurrent();
      await loadWaiting();
      await loadQueue();
      await loadHistory();
      await loadFollowups();
    }

    async function loadFollowups() {
      const params = {};
      const status = document.getElementById('followupStatusFilter').value;
      const startDate = document.getElementById('followupStartDate').value;
      const endDate = document.getElementById('followupEndDate').value;
      
      if (status) params.status = status;
      if (startDate) params.start_date = startDate;
      if (endDate) params.end_date = endDate;

      const result = await api.doctor.getFollowups(params);
      const statusMap = {
        pending: '待提醒',
        contacted: '已联系',
        no_answer: '未接通',
        cancelled: '已取消',
        completed: '已完成'
      };
      const statusClass = {
        pending: 'status-waiting',
        contacted: 'status-consulting',
        no_answer: 'status-called',
        cancelled: 'status-returned',
        completed: 'status-completed'
      };

      if (result.plans.length === 0) {
        document.querySelector('#followupTable tbody').innerHTML = '<tr><td colspan="8" style="text-align: center; color: #999;">暂无随访计划</td></tr>';
        return;
      }

      document.querySelector('#followupTable tbody').innerHTML = result.plans.map(f => `
        <tr>
          <td>${f.patient_name}</td>
          <td>${f.department_name}</td>
          <td>${f.followup_date}</td>
          <td>${f.reminder_method}</td>
          <td>${f.related_diagnosis || '-'}</td>
          <td><span class="status-badge ${statusClass[f.status]}">${statusMap[f.status]}</span></td>
          <td>${f.created_at ? f.created_at.slice(0, 16) : '-'}</td>
          <td>
            ${f.status === 'pending' ? 
              `<button class="btn btn-sm btn-danger" onclick="openFollowupCancelModal(${f.id})">取消</button>` : 
              '<span style="color: #999;">-</span>'}
          </td>
        </tr>
      `).join('');
    }

    function openFollowupCancelModal(id) {
      currentCancelFollowupId = id;
      document.getElementById('followupCancelReason').value = '';
      document.getElementById('followupCancelModal').classList.add('active');
    }

    function closeFollowupCancelModal() {
      currentCancelFollowupId = null;
      document.getElementById('followupCancelModal').classList.remove('active');
    }

    async function confirmCancelFollowup() {
      const reason = document.getElementById('followupCancelReason').value.trim();
      if (!reason) return showAlert('请输入取消原因', 'error');
      if (!confirm('确认取消该随访计划？')) return;

      try {
        await api.doctor.cancelFollowup(currentCancelFollowupId, reason);
        showAlert('随访计划已取消');
        closeFollowupCancelModal();
        loadFollowups();
      } catch (e) {
        showAlert(e.message, 'error');
      }
    }

    loadAll();
    setInterval(loadAll, 5000);
  </script>
</body>
</html>
